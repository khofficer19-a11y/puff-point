<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Cart | PUFF POINT</title>
<link rel="stylesheet" href="shop.css">
</head><body>
<div class="top"><a class="logo" href="index.html">PUFF POINT</a><a class="cartlink" href="cart.html">Cart<span id="cartBadge">0</span></a></div>
<div class="w">
<h1>Your Cart</h1>
<div class="shipbar" id="shipbar"></div>
<div id="content"></div>
<div class="warn">WARNING: This product contains nicotine. Nicotine is an addictive chemical. Adults 21+ only.</div>
</div>
<div class="tabbar" role="navigation" aria-label="Main">
<a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
<a href="index.html?search#collection" id="tabSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search</a>
<a href="account.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Account</a>
<a href="cart.html" class="on"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10.5l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>Cart<span class="cartbadge">0</span></a>
<a href="rewards.html"><svg viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="4"/><path d="M5 12v8h14v-8"/><path d="M12 8v12"/><path d="M12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zm0 0c1.5-3 5-3.5 5-1.5S14 8 12 8z"/></svg>Rewards</a>
</div>
<script src="shop.js"></script>
<script>
function render(){
  var lines=cartLines(), el=document.getElementById('content');
  if(!lines.length){el.innerHTML='<div class="empty"><p>Your cart is empty.</p><a class="btn" href="index.html#shop">Continue Shopping</a></div>';return;}
  var sub=subtotal(), ship=shippingCost(sub), html='<div class="cols"><div class="glass">';
  lines.forEach(function(l){
    html+='<div class="row"><div class="thumb"></div><div class="grow"><b>'+l.name+'</b><br><span style="color:var(--gold2)">'+money(l.price)+'</span></div>'+
    '<div class="qty"><button onclick="setQty(\''+l.id+'\','+(l.qty-1)+');render()">&minus;</button><span>'+l.qty+'</span><button onclick="setQty(\''+l.id+'\','+(l.qty+1)+');render()">+</button></div>'+
    '<div style="width:80px;text-align:right">'+money(l.price*l.qty)+'</div>'+
    '<button class="rm" onclick="setQty(\''+l.id+'\',0);render()">Remove</button></div>';
  });
  html+='</div><div class="glass sum"><h2>Order Summary</h2><div><span>Subtotal</span><span>'+money(sub)+'</span></div>'+
  '<div><span>Shipping</span><span>'+(ship===0?'FREE':money(ship))+'</span></div>'+
  (sub<FREE_SHIPPING_OVER?'<div style="font-size:12px;color:var(--muted)">Free shipping over '+money(FREE_SHIPPING_OVER)+'</div>':'')+
  '<div class="total"><span>Total</span><span>'+money(sub+ship)+'</span></div><br>'+
  '<a class="btn fill block" href="checkout.html">Proceed to Checkout</a></div></div>';
  el.innerHTML=html;
}
render();
</script>
</body></html>
