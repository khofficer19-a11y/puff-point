<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account | PUFF POINT</title>
<link rel="stylesheet" href="shop.css">
<style>
.hello{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.pts{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1;color:var(--gold2)}
.pts small{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.badge{display:inline-block;border:1px solid var(--gold);color:var(--gold2);font-size:11px;letter-spacing:.26em;text-transform:uppercase;padding:6px 14px}
.bar{height:4px;background:rgba(212,175,106,.18);margin:14px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.two-c{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:800px){.two-c{grid-template-columns:1fr}}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
</style>
</head><body>
<div class="top"><a class="logo" href="index.html">PUFF POINT</a><a class="cartlink" href="cart.html">Cart<span id="cartBadge">0</span></a></div>
<div class="w">
<div id="view"></div>
<div class="warn">WARNING: This product contains nicotine. Nicotine is an addictive chemical. Adults 21+ only.</div>
</div>
<div class="tabbar" role="navigation" aria-label="Main">
<a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
<a href="index.html?search#collection" id="tabSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search</a>
<a href="account.html" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Account</a>
<a href="cart.html"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10.5l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>Cart<span class="cartbadge">0</span></a>
<a href="rewards.html"><svg viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="4"/><path d="M5 12v8h14v-8"/><path d="M12 8v12"/><path d="M12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zm0 0c1.5-3 5-3.5 5-1.5S14 8 12 8z"/></svg>Rewards</a>
</div>

<script src="shop.js"></script>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function render(){
  var u=currentUser(),v=document.getElementById('view');
  if(!u){
    v.innerHTML='<h1>My Account</h1><div class="two-c"><div class="glass"><h2>Join or sign in</h2>'+
    '<form id="f" novalidate><label for="n">Name</label><input id="n" autocomplete="name"><label for="e">Email</label><input id="e" type="email" autocomplete="email">'+
    '<div class="err" id="err"></div><button class="btn fill block" type="submit">Continue</button></form>'+
    '<div class="note">Demo account. It has no password and lives only in this browser. A live store needs real accounts from the store platform.</div></div>'+
    '<div class="glass"><h2>Why join?</h2><p>Earn <b style="color:var(--gold2)">1 reward point for every $1</b> you spend. Every 100 points is worth '+money(REWARDS.minRedeem*REWARDS.pointValue)+' off.</p><p>Reach Silver and Gold for faster earning.</p><a class="btn" href="rewards.html">See how rewards work</a></div></div>';
    document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();
      var e=document.getElementById('e').value.trim();
      if(!/^\S+@\S+\.\S+$/.test(e)){document.getElementById('err').textContent='Enter a valid email.';return}
      signIn(document.getElementById('n').value,e);render()});
    return}
  var t=tierOf(u),nx=nextTier(u),pct=nx?Math.min(100,Math.round(u.lifetime/nx.at*100)):100;
  var orders=lsGet('pp_orders',[]).filter(function(o){return o.customer&&String(o.customer.email).toLowerCase()===u.email}).reverse();
  var rows=orders.map(function(o){return '<tr><td>'+esc(o.id)+'</td><td>'+new Date(o.date).toLocaleDateString()+'</td><td>'+o.items.reduce(function(s,i){return s+i.qty},0)+'</td><td>'+money(o.total)+'</td><td>+'+(o.pointsEarned||0)+'</td></tr>'}).join('');
  v.innerHTML='<div class="hello"><div><h1 style="margin:0">Hello, '+esc(u.name)+'</h1><div style="color:var(--muted);font-size:13px">'+esc(u.email)+'</div></div><div><span class="badge">'+t.n+' member</span></div></div>'+
  '<div class="two-c"><div class="glass"><div class="pts"><small>Reward points</small>'+u.points+'</div><div style="color:var(--muted);margin-top:6px">Worth '+money(u.points*REWARDS.pointValue)+(u.points<REWARDS.minRedeem?' &middot; redeem from '+REWARDS.minRedeem+' points':' at checkout')+'</div>'+
  '<div class="bar"><i style="width:'+pct+'%"></i></div><div style="font-size:12px;color:var(--muted)">'+(nx?(nx.at-u.lifetime)+' more points to reach '+nx.n+' ('+nx.mult+'x points)':'You are at the top tier')+'</div></div>'+
  '<div class="glass"><h2>Quick links</h2><p><a class="btn" href="index.html#collection">Keep shopping</a></p><p><a class="btn" href="rewards.html">Rewards program</a></p><button class="linkbtn" id="out">Sign out</button></div></div>'+
  '<div class="glass" style="margin-top:22px"><h2>Order history</h2>'+(rows?'<div class="scroll"><table><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Points</th></tr>'+rows+'</table></div>':'<p style="color:var(--muted)">No orders yet. Test orders you place while signed in show up here.</p>')+'</div>';
  document.getElementById('out').onclick=function(){signOut();render()};
}
render();
</script>
</body></html>
